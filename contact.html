<!-- HEADER -->
<header class="page-header py-5">
<div class="container text-center">
    <h1 class="fw-bold">Contact Us</h1>
    <p class="lead mb-0">Async Submission with Callback Handling</p>
</div>
</header>

<!-- FORM -->
<main class="container py-5">
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <h2 class="card-title text-center mb-4">Contact Form</h2>
                <form id="contactForm" data-validate novalidate>

                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required>
                        <div class="error-text" data-error-for="name"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        <div class="error-text" data-error-for="email"></div>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category">
                            <option selected>Choose a category</option>
                            <option>Teams</option>
                            <option>Players</option>
                            <option>Matches</option>
                            <option>Website</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>
                        <div class="error-text" data-error-for="message"></div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="agreement" name="agreement" required>
                        <label class="form-check-label" for="agreement">I agree to submit this form.</label>
                        <div class="error-text" data-error-for="agreement"></div>
                    </div>

                    <div class="form-status mb-3" aria-live="polite"></div>

                    <div class="d-grid gap-2 d-md-flex">
                        <button type="submit" class="btn btn-primary btn-lg flex-md-grow-1 btn-animate">Send Message</button>
                        <button type="reset" class="btn btn-secondary btn-lg btn-animate">Reset</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
</main>
